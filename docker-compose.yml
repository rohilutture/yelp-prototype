version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yelp_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user-service:
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/yelp_db
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_SCOPE: user
    depends_on:
      - mysql
      - mongodb
      - kafka
    ports:
      - "8001:8000"

  owner-service:
    build:
      context: .
      dockerfile: docker/owner-service.Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/yelp_db
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_SCOPE: owner
    depends_on:
      - mysql
      - mongodb
      - kafka
    ports:
      - "8002:8000"

  restaurant-service:
    build:
      context: .
      dockerfile: docker/restaurant-service.Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/yelp_db
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_SCOPE: restaurant
    depends_on:
      - mysql
      - mongodb
      - kafka
    ports:
      - "8003:8000"

  review-service:
    build:
      context: .
      dockerfile: docker/review-service.Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/yelp_db
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_SCOPE: review
    depends_on:
      - mysql
      - mongodb
      - kafka
    ports:
      - "8004:8000"

  review-worker:
    build:
      context: .
      dockerfile: docker/review-worker.Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/yelp_db
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mysql
      - mongodb
      - kafka

  restaurant-worker:
    build:
      context: .
      dockerfile: docker/restaurant-worker.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mongodb
      - kafka

  user-worker:
    build:
      context: .
      dockerfile: docker/user-worker.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mongodb
      - kafka

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - restaurant-service
      - review-service
      - owner-service

volumes:
  mysql_data:
  mongo_data:
