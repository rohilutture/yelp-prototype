version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user-service:
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICE_SCOPE: user
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8001:8000"

  owner-service:
    build:
      context: .
      dockerfile: docker/owner-service.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICE_SCOPE: owner
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8002:8000"

  restaurant-service:
    build:
      context: .
      dockerfile: docker/restaurant-service.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICE_SCOPE: restaurant
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8003:8000"

  review-service:
    build:
      context: .
      dockerfile: docker/review-service.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICE_SCOPE: review
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8004:8000"

  review-worker:
    build:
      context: .
      dockerfile: docker/review-worker.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mongodb
      - kafka

  restaurant-worker:
    build:
      context: .
      dockerfile: docker/restaurant-worker.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mongodb
      - kafka

  user-worker:
    build:
      context: .
      dockerfile: docker/user-worker.Dockerfile
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mongodb
      - kafka

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - restaurant-service
      - review-service
      - owner-service

volumes:
  mongo_data:
