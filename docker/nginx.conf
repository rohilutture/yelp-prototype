server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to backend services (strip /api prefix)
  location ^~ /api/auth/ {
    proxy_pass http://user-service:8000/auth/;
  }
  location ^~ /api/users/ {
    proxy_pass http://user-service:8000/users/;
  }

  # Review endpoints mounted under /restaurants/{id}/reviews
  location ~ ^/api/restaurants/[^/]+/reviews$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://review-service:8000;
  }

  # Exact create/list endpoint without trailing slash
  location = /api/restaurants {
    proxy_pass http://restaurant-service:8000/restaurants;
  }

  location /api/restaurants/ {
    proxy_pass http://restaurant-service:8000/restaurants/;
  }

  location ^~ /api/reviews/ {
    proxy_pass http://review-service:8000/reviews/;
  }

  location ^~ /api/owner/ {
    proxy_pass http://owner-service:8000/owner/;
  }

  # Fallback: send unknown /api paths to user-service
  location ^~ /api/ {
    proxy_pass http://user-service:8000/;
  }

  # Uploads served by the backend
  location /uploads/ {
    proxy_pass http://user-service:8000;
  }
}

